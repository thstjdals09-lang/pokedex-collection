<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포켓몬 카드 컬렉션</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#dc2626;--blue:#1d4ed8;--green:#16a34a;
  --g50:#f9fafb;--g100:#f3f4f6;--g200:#e5e7eb;--g300:#d1d5db;
  --g400:#9ca3af;--g500:#6b7280;--g600:#4b5563;--g700:#374151;--g900:#111827;
  --sh:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06);
  --sh-lg:0 10px 15px rgba(0,0,0,.1),0 4px 6px rgba(0,0,0,.05);
  --sh-xl:0 20px 25px rgba(0,0,0,.1),0 10px 10px rgba(0,0,0,.04);
  --r:10px;--rl:16px;--rxl:24px
}
body{font-family:'Noto Sans KR',-apple-system,sans-serif;background:var(--g100);color:var(--g900);min-height:100vh;line-height:1.5}

/* HEADER */
header{background:linear-gradient(135deg,#dc2626,#b91c1c);color:#fff;padding:0 20px;height:60px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 10px rgba(0,0,0,.25);position:sticky;top:0;z-index:100}
.pokeball{width:36px;height:36px;flex-shrink:0}
.h-title{font-size:18px;font-weight:800;letter-spacing:-.3px}
.h-sub{font-size:12px;opacity:.75;margin-left:auto}

/* TABS */
.tabs{background:#fff;display:flex;border-bottom:2px solid var(--g200);position:sticky;top:60px;z-index:99}
.tab-btn{padding:13px 22px;font-size:14px;font-weight:600;color:var(--g500);background:none;border:none;border-bottom:3px solid transparent;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:7px;margin-bottom:-2px;font-family:inherit}
.tab-btn:hover{color:var(--blue)}
.tab-btn.active{color:var(--blue);border-bottom-color:var(--blue)}
.badge{background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:1px 7px;border-radius:10px;min-width:20px;text-align:center}

/* PANELS */
.panel{display:none}.panel.active{display:block}

/* SEARCH CONTROLS */
.search-box{background:#fff;padding:16px 20px;border-bottom:1px solid var(--g200);display:flex;flex-direction:column;gap:11px}
.lang-row{display:flex;gap:7px;flex-wrap:wrap}
.lang-chip{padding:7px 15px;font-size:13px;font-weight:600;border:2px solid var(--g200);border-radius:20px;cursor:pointer;background:#fff;color:var(--g600);transition:all .15s;font-family:inherit}
.lang-chip:hover{border-color:var(--blue);color:var(--blue)}
.lang-chip.active{background:var(--blue);border-color:var(--blue);color:#fff}
.search-row{display:flex;gap:8px}
.search-input{flex:1;padding:10px 15px;font-size:15px;font-family:inherit;border:2px solid var(--g200);border-radius:var(--r);outline:none;transition:border-color .15s;color:var(--g900)}
.search-input:focus{border-color:var(--blue)}
.search-input::placeholder{color:var(--g400)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:10px 18px;font-size:14px;font-weight:600;font-family:inherit;border:none;border-radius:var(--r);cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-blue{background:var(--blue);color:#fff}.btn-blue:hover{background:#1e40af}.btn-blue:active{transform:scale(.97)}
.btn-gray{background:var(--g100);color:var(--g700)}.btn-gray:hover{background:var(--g200)}
.btn-red{background:#fee2e2;color:var(--red)}.btn-red:hover{background:#fecaca}
.btn-green{background:#dcfce7;color:var(--green)}.btn-green:hover{background:#bbf7d0}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-icon{padding:8px;border-radius:8px}

/* CARD GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px;padding:18px 20px}
@media(max-width:480px){.grid{grid-template-columns:repeat(2,1fr);gap:10px;padding:12px}}
.card-item{background:#fff;border-radius:var(--rl);overflow:hidden;box-shadow:var(--sh);cursor:pointer;transition:transform .2s,box-shadow .2s;position:relative}
.card-item:hover{transform:translateY(-3px) scale(1.01);box-shadow:var(--sh-xl)}
.card-img-wrap{width:100%;aspect-ratio:2.5/3.5;background:linear-gradient(135deg,var(--g100),var(--g200));display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.card-img{width:100%;height:100%;object-fit:contain;transition:transform .3s}
.card-item:hover .card-img{transform:scale(1.04)}
.no-img{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--g400);font-size:11px}
.card-info{padding:9px 11px 11px}
.card-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.card-set{font-size:11px;color:var(--g500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:5px}
.card-price{font-size:13px;font-weight:700;color:var(--green)}
.qty-badge{position:absolute;top:7px;right:7px;background:var(--blue);color:#fff;font-size:11px;font-weight:700;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.lang-badge{position:absolute;top:7px;left:7px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px}

/* LOADING / EMPTY */
.loading{padding:60px;display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--g400)}
.spinner{width:44px;height:44px;border:4px solid var(--g200);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{padding:56px 20px;text-align:center;color:var(--g400)}
.empty-icon{font-size:60px;margin-bottom:14px}
.empty h3{font-size:17px;font-weight:700;color:var(--g600);margin-bottom:6px}
.empty p{font-size:13px}

/* STATS */
.stats-bar{background:#fff;border-bottom:1px solid var(--g200);padding:14px 20px;display:flex;gap:28px;overflow-x:auto}
.stat-v{font-size:22px;font-weight:800;color:var(--blue);line-height:1}
.stat-l{font-size:11px;color:var(--g400);margin-top:2px;font-weight:500}
.coll-controls{background:#fff;border-bottom:1px solid var(--g200);padding:11px 20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sort-sel{padding:7px 11px;font-size:13px;font-family:inherit;border:1px solid var(--g300);border-radius:8px;outline:none;cursor:pointer;color:var(--g700);background:#fff}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;backdrop-filter:blur(4px);animation:fi .15s ease}
@keyframes fi{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:var(--rxl);width:100%;max-width:460px;max-height:90vh;overflow-y:auto;box-shadow:var(--sh-xl);animation:su .2s ease}
@keyframes su{from{transform:translateY(18px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--g200);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:17px;font-weight:800}
.close-btn{width:30px;height:30px;border-radius:50%;border:none;background:var(--g100);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--g500);transition:background .15s}
.close-btn:hover{background:var(--g200)}
.modal-body{padding:22px}
.modal-foot{padding:14px 22px;border-top:1px solid var(--g200);display:flex;gap:8px;justify-content:flex-end}

/* MODAL CARD PREVIEW */
.m-preview{display:flex;gap:14px;margin-bottom:18px}
.m-card-img{width:110px;height:154px;border-radius:var(--r);object-fit:contain;background:var(--g100);flex-shrink:0}
.m-card-info h3{font-size:17px;font-weight:800;margin-bottom:3px}
.m-card-info .m-set{font-size:12px;color:var(--g500);margin-bottom:8px}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;padding:3px 9px;border-radius:11px;font-size:11px;font-weight:600}
.chip-blue{background:#dbeafe;color:#1d4ed8}
.chip-green{background:#dcfce7;color:#16a34a}
.chip-yellow{background:#fef9c3;color:#a16207}
.chip-gray{background:var(--g100);color:var(--g600)}
.price-tag{display:inline-flex;align-items:center;gap:4px;background:#dcfce7;color:var(--green);font-size:12px;font-weight:700;padding:4px 9px;border-radius:6px;margin-bottom:5px}
.price-range{font-size:11px;color:var(--g400)}

/* FORM */
.form-g{margin-bottom:14px}
label{display:block;font-size:13px;font-weight:600;color:var(--g700);margin-bottom:5px}
.form-ctrl{width:100%;padding:9px 13px;font-size:14px;font-family:inherit;border:2px solid var(--g200);border-radius:var(--r);outline:none;transition:border-color .15s;color:var(--g900);background:#fff}
.form-ctrl:focus{border-color:var(--blue)}
textarea.form-ctrl{resize:vertical}
.qty-ctrl{display:flex;align-items:center;border:2px solid var(--g200);border-radius:var(--r);overflow:hidden;width:fit-content}
.qty-btn{width:36px;height:36px;border:none;background:var(--g100);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--g700);transition:background .15s;font-family:inherit}
.qty-btn:hover{background:var(--g200)}
.qty-val{width:46px;text-align:center;font-size:15px;font-weight:700;border:none;border-left:2px solid var(--g200);border-right:2px solid var(--g200);padding:7px 0;outline:none;color:var(--g900);font-family:inherit}

/* UPLOAD */
.upload-area{border:2px dashed var(--g300);border-radius:var(--r);padding:18px;text-align:center;cursor:pointer;transition:all .15s;color:var(--g500)}
.upload-area:hover{border-color:var(--blue);color:var(--blue);background:#eff6ff}
.upload-area.has-img{border-color:var(--green);background:#f0fdf4}
.upload-prev{width:100%;max-height:180px;object-fit:contain;border-radius:8px;margin-bottom:7px}

/* DETAIL */
.detail-img{width:100%;max-width:200px;margin:0 auto 14px;display:block;border-radius:var(--r)}
.price-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0}
.p-cell{background:var(--g50);padding:9px 11px;border-radius:8px}
.p-cell-l{font-size:11px;color:var(--g400);font-weight:500;margin-bottom:2px}
.p-cell-v{font-size:14px;font-weight:700}
.divider{height:1px;background:var(--g200);margin:14px 0}
.sec-title{font-size:11px;font-weight:700;color:var(--g400);text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px}
.note-box{background:var(--g50);padding:10px 12px;border-radius:8px;font-size:13px;color:var(--g700);margin-bottom:12px}

/* TOAST */
.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:7px;pointer-events:none}
.toast{background:var(--g900);color:#fff;padding:11px 18px;border-radius:var(--r);font-size:13px;font-weight:500;box-shadow:var(--sh-lg);animation:ti .3s ease,to .3s ease 2.7s forwards;max-width:300px}
.toast-ok{background:#166534}.toast-err{background:#991b1b}
@keyframes ti{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes to{from{transform:translateX(0);opacity:1}to{transform:translateX(110%);opacity:0}}

.hidden{display:none!important}
.text-muted{color:var(--g400);font-size:12px}
</style>
</head>
<body>

<header>
  <svg class="pokeball" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <circle cx="50" cy="50" r="47" fill="white" stroke="#333" stroke-width="5"/>
    <path d="M3 50 A47 47 0 0 1 97 50 Z" fill="#dc2626"/>
    <line x1="3" y1="50" x2="97" y2="50" stroke="#333" stroke-width="5"/>
    <circle cx="50" cy="50" r="13" fill="white" stroke="#333" stroke-width="5"/>
    <circle cx="50" cy="50" r="6" fill="#e5e7eb"/>
  </svg>
  <div class="h-title">포켓몬 카드 컬렉션</div>
  <div class="h-sub" id="h-sub">컬렉션을 관리하세요</div>
</header>

<nav class="tabs">
  <button class="tab-btn active" onclick="switchTab('search')" id="tab-search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    카드 검색
  </button>
  <button class="tab-btn" onclick="switchTab('coll')" id="tab-coll">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 11H5m14 0a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2m14 0V9a2 2 0 0 0-2-2M5 11V9a2 2 0 0 1 2-2m0 0V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2M7 7h10"/></svg>
    내 컬렉션
    <span class="badge" id="coll-badge">0</span>
  </button>
</nav>

<!-- SEARCH PANEL -->
<div class="panel active" id="panel-search">
  <div class="search-box">
    <div class="lang-row">
      <button class="lang-chip active" onclick="setLang('ko')" id="lang-ko">🇰🇷 한국판</button>
      <button class="lang-chip" onclick="setLang('ja')" id="lang-ja">🇯🇵 일본판</button>
      <button class="lang-chip" onclick="setLang('en')" id="lang-en">🇺🇸 영문판</button>
    </div>
    <div class="search-row">
      <input type="text" class="search-input" id="search-input" placeholder="카드 이름으로 검색..." onkeydown="if(event.key==='Enter')doSearch()">
      <button class="btn btn-blue" onclick="doSearch()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        검색
      </button>
    </div>
  </div>
  <div id="search-content">
    <div class="empty"><div class="empty-icon">🔍</div><h3>카드를 검색해보세요</h3><p>카드 이름을 입력하고 검색 버튼을 눌러주세요</p></div>
  </div>
</div>

<!-- COLLECTION PANEL -->
<div class="panel" id="panel-coll">
  <div class="stats-bar">
    <div><div class="stat-v" id="st-total">0</div><div class="stat-l">총 카드 수</div></div>
    <div><div class="stat-v" id="st-unique">0</div><div class="stat-l">종류</div></div>
    <div><div class="stat-v" id="st-val">-</div><div class="stat-l">예상 시세(달러)</div></div>
  </div>
  <div class="coll-controls">
    <select class="sort-sel" onchange="renderColl()">
      <option value="date-d">최근 추가순</option>
      <option value="date-a">오래된순</option>
      <option value="name-a">이름순 ↑</option>
      <option value="name-d">이름순 ↓</option>
      <option value="price-d">가격 높은순</option>
      <option value="qty-d">수량 많은순</option>
    </select>
    <div style="margin-left:auto;display:flex;gap:7px">
      <button class="btn btn-gray btn-sm" onclick="exportColl()">📤 내보내기</button>
      <button class="btn btn-gray btn-sm" onclick="document.getElementById('import-file').click()">📥 가져오기</button>
      <input type="file" id="import-file" accept=".json" class="hidden" onchange="importColl(this)">
    </div>
  </div>
  <div id="coll-content">
    <div class="empty"><div class="empty-icon">📦</div><h3>컬렉션이 비어있어요</h3><p>카드를 검색해서 추가해보세요!</p></div>
  </div>
</div>

<!-- ADD MODAL -->
<div class="overlay hidden" id="add-modal" onclick="if(event.target===this)closeAdd()">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title">컬렉션에 추가</div>
      <button class="close-btn" onclick="closeAdd()">✕</button>
    </div>
    <div class="modal-body">
      <div class="m-preview" id="add-preview"></div>
      <div class="form-g">
        <label>수량</label>
        <div class="qty-ctrl">
          <button class="qty-btn" onclick="adjQty(-1)">−</button>
          <input type="number" class="qty-val" id="add-qty" value="1" min="1" max="99">
          <button class="qty-btn" onclick="adjQty(1)">+</button>
        </div>
      </div>
      <div class="form-g">
        <label>상태</label>
        <select class="form-ctrl" id="add-cond">
          <option value="mint">완벽 (Mint)</option>
          <option value="near-mint" selected>거의 완벽 (Near Mint)</option>
          <option value="excellent">우수 (Excellent)</option>
          <option value="good">좋음 (Good)</option>
          <option value="poor">나쁨 (Poor)</option>
        </select>
      </div>
      <div class="form-g">
        <label>메모</label>
        <textarea class="form-ctrl" id="add-note" rows="2" placeholder="메모..."></textarea>
      </div>
      <div class="form-g">
        <label>커스텀 이미지 <span class="text-muted">(선택)</span></label>
        <div class="upload-area" id="upload-area" onclick="document.getElementById('img-file').click()">
          <div id="upload-ph">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin:0 auto 7px;display:block;opacity:.35"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <div style="font-size:13px">클릭하여 이미지 업로드</div>
            <div class="text-muted" style="margin-top:3px">JPG · PNG · WEBP</div>
          </div>
          <img id="upload-prev" class="upload-prev hidden">
          <div id="upload-clear" class="hidden" style="margin-top:7px">
            <button class="btn btn-gray btn-sm" onclick="clearImg(event)">이미지 제거</button>
          </div>
        </div>
        <input type="file" id="img-file" accept="image/*" class="hidden" onchange="handleImg(this)">
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-gray" onclick="closeAdd()">취소</button>
      <button class="btn btn-blue" onclick="confirmAdd()">추가하기</button>
    </div>
  </div>
</div>

<!-- DETAIL MODAL -->
<div class="overlay hidden" id="detail-modal" onclick="if(event.target===this)closeDetail()">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="detail-title">카드 상세</div>
      <button class="close-btn" onclick="closeDetail()">✕</button>
    </div>
    <div class="modal-body" id="detail-body"></div>
    <div class="modal-foot" id="detail-foot"></div>
  </div>
</div>

<!-- TOAST -->
<div class="toast-wrap" id="toast-wrap"></div>

<script>
// ── STATE ──────────────────────────────────────────────────
const SK = 'pkm_coll_v2';
let lang = 'ko';
let searchResults = [];
let collection = load();
let pendCard = null;
let pendImg = null;
let detailId = null;

// ── STORAGE ────────────────────────────────────────────────
function load() {
  try { return JSON.parse(localStorage.getItem(SK) || '[]'); } catch { return []; }
}
function save() {
  try { localStorage.setItem(SK, JSON.stringify(collection)); }
  catch { toast('저장 공간이 부족합니다. 커스텀 이미지를 줄여보세요.', 'err'); }
}

// ── TABS ───────────────────────────────────────────────────
function switchTab(t) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-' + t).classList.add('active');
  document.getElementById('tab-' + t).classList.add('active');
  if (t === 'coll') renderColl();
}

// ── LANGUAGE ───────────────────────────────────────────────
function setLang(l) {
  lang = l;
  document.querySelectorAll('.lang-chip').forEach(c => c.classList.remove('active'));
  document.getElementById('lang-' + l).classList.add('active');
  const ph = {ko:'한국어 이름으로 검색...',ja:'일본어 이름으로 검색...',en:'영어 이름으로 검색...'};
  document.getElementById('search-input').placeholder = ph[l];
}

// ── API ────────────────────────────────────────────────────
async function searchTCGdex(l, q) {
  const url = `https://api.tcgdex.net/v2/${l}/cards?name=${encodeURIComponent(q)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`TCGdex ${res.status}`);
  const data = await res.json();
  const arr = Array.isArray(data) ? data : [];
  const ql = q.toLowerCase();
  return arr
    .filter(c => !q || c.name.toLowerCase().includes(ql))
    .slice(0, 48)
    .map(c => ({
      id: `td_${l}_${c.id}`,
      apiId: c.id,
      name: c.name,
      localId: c.localId || '',
      image: c.image ? c.image + '/high.webp' : null,
      set: c.set?.name || '',
      setId: c.set?.id || '',
      lang: l,
      src: 'tcgdex',
      prices: null,
    }));
}

async function searchPTCG(q) {
  const url = `https://api.pokemontcg.io/v2/cards?q=name:*${encodeURIComponent(q)}*&pageSize=30&orderBy=name`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`PTCG ${res.status}`);
  const data = await res.json();
  return (data.data || []).map(c => ({
    id: `ptcg_${c.id}`,
    apiId: c.id,
    name: c.name,
    number: c.number || '',
    image: c.images?.large || c.images?.small || null,
    set: c.set?.name || '',
    setId: c.set?.id || '',
    lang: 'en',
    src: 'ptcg',
    prices: getPrices(c),
  }));
}

function getPrices(c) {
  const out = {};
  const tcg = c.tcgplayer?.prices;
  if (tcg) {
    for (const t of ['normal','holofoil','reverseHolofoil','1stEditionNormal','1stEditionHolofoil']) {
      if (tcg[t]?.market) {
        out.market = tcg[t].market;
        out.low = tcg[t].low;
        out.high = tcg[t].high;
        out.type = t;
        out.src = 'TCGPlayer';
        out.cur = 'USD';
        break;
      }
    }
  }
  const cm = c.cardmarket?.prices;
  if (cm?.averageSellPrice) {
    out.cmAvg = cm.averageSellPrice;
    out.cmLow = cm.lowPrice;
    if (!out.market) { out.market = cm.averageSellPrice; out.cur = 'EUR'; out.src = 'Cardmarket'; }
  }
  return Object.keys(out).length ? out : null;
}

async function fetchPriceFor(card) {
  if (card.src === 'ptcg') {
    try {
      const r = await fetch(`https://api.pokemontcg.io/v2/cards/${card.apiId}`);
      if (!r.ok) return null;
      const d = await r.json();
      return getPrices(d.data);
    } catch { return null; }
  }
  // TCGdex card: try pokemontcg.io with same ID (set codes often match)
  const ids = [card.apiId, card.apiId.replace(/-0+(\d)/, '-$1')];
  for (const id of [...new Set(ids)]) {
    try {
      const r = await fetch(`https://api.pokemontcg.io/v2/cards/${id}`);
      if (r.ok) { const d = await r.json(); const p = getPrices(d.data); if (p) return p; }
    } catch {}
  }
  // Fallback: search by English name (user may need to enter English name separately)
  return null;
}

// ── SEARCH ─────────────────────────────────────────────────
async function doSearch() {
  const q = document.getElementById('search-input').value.trim();
  if (!q) { toast('검색어를 입력해주세요', 'err'); return; }
  const cont = document.getElementById('search-content');
  cont.innerHTML = '<div class="loading"><div class="spinner"></div><div>검색 중...</div></div>';
  try {
    searchResults = lang === 'en' ? await searchPTCG(q) : await searchTCGdex(lang, q);
    renderSearch(cont);
  } catch (e) {
    cont.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><h3>검색 오류</h3><p>잠시 후 다시 시도해주세요</p><p class="text-muted" style="margin-top:6px">${e.message}</p></div>`;
  }
}

function renderSearch(cont) {
  if (!searchResults.length) {
    cont.innerHTML = '<div class="empty"><div class="empty-icon">🔎</div><h3>검색 결과 없음</h3><p>다른 키워드로 검색해보세요</p></div>';
    return;
  }
  let html = `<div style="padding:12px 20px 0;font-size:13px;color:var(--g400);font-weight:500">${searchResults.length}개 카드</div><div class="grid">`;
  searchResults.forEach((card, i) => {
    const owned = collection.find(c => c.id === card.id);
    const lbl = {ko:'한국',ja:'일본',en:'영문'}[card.lang] || card.lang;
    const priceStr = card.prices?.market ? `${card.prices.cur==='USD'?'$':'€'}${card.prices.market.toFixed(2)}` : '';
    html += `<div class="card-item" onclick="openAdd(${i})">
      <div class="card-img-wrap">
        ${card.image ? `<img class="card-img" src="${card.image}" alt="${esc(card.name)}" loading="lazy" onerror="this.parentNode.innerHTML=noImg()">` : noImg()}
        <div class="lang-badge">${lbl}</div>
        ${owned ? `<div class="qty-badge">${owned.quantity}</div>` : ''}
      </div>
      <div class="card-info">
        <div class="card-name">${esc(card.name)}</div>
        <div class="card-set">${esc(card.set||'세트 미상')}</div>
        ${priceStr ? `<div class="card-price">${priceStr}</div>` : ''}
      </div>
    </div>`;
  });
  html += '</div>';
  cont.innerHTML = html;
}

function noImg() {
  return `<div class="no-img"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><span>이미지 없음</span></div>`;
}

// ── ADD MODAL ──────────────────────────────────────────────
function openAdd(idx) {
  pendCard = searchResults[idx];
  pendImg = null;
  document.getElementById('add-qty').value = 1;
  document.getElementById('add-cond').value = 'near-mint';
  document.getElementById('add-note').value = '';
  document.getElementById('upload-prev').classList.add('hidden');
  document.getElementById('upload-ph').classList.remove('hidden');
  document.getElementById('upload-clear').classList.add('hidden');
  document.getElementById('upload-area').classList.remove('has-img');
  document.getElementById('img-file').value = '';

  const c = pendCard;
  const owned = collection.find(x => x.id === c.id);
  const lbl = {ko:'한국판',ja:'일본판',en:'영문판'}[c.lang] || c.lang;
  const pHtml = c.prices?.market
    ? `<div class="price-tag">💰 ${c.prices.cur==='USD'?'$':'€'}${c.prices.market.toFixed(2)} <span style="font-weight:400;opacity:.7">${c.prices.src||''}</span></div>${c.prices.low&&c.prices.high?`<div class="price-range">$${c.prices.low.toFixed(2)} ~ $${c.prices.high.toFixed(2)}</div>`:''}`
    : `<div class="text-muted">시세 정보 없음</div>`;
  document.getElementById('add-preview').innerHTML = `
    <img class="m-card-img" src="${c.image||''}" alt="${esc(c.name)}" onerror="this.style.background='var(--g100)';this.src=''">
    <div class="m-card-info">
      <h3>${esc(c.name)}</h3>
      <div class="m-set">${esc(c.set||'세트 미상')}</div>
      <div class="chips">
        <span class="chip chip-blue">${lbl}</span>
        ${owned ? `<span class="chip chip-green">보유 ${owned.quantity}장</span>` : ''}
      </div>
      ${pHtml}
    </div>`;
  document.getElementById('add-modal').classList.remove('hidden');
}

function closeAdd() { document.getElementById('add-modal').classList.add('hidden'); pendCard = null; pendImg = null; }

function adjQty(d) {
  const el = document.getElementById('add-qty');
  el.value = Math.max(1, Math.min(99, (parseInt(el.value)||1) + d));
}

async function handleImg(input) {
  const file = input.files[0];
  if (!file) return;
  try {
    const b64 = await resizeImg(file, 420);
    pendImg = b64;
    const prev = document.getElementById('upload-prev');
    prev.src = b64; prev.classList.remove('hidden');
    document.getElementById('upload-ph').classList.add('hidden');
    document.getElementById('upload-clear').classList.remove('hidden');
    document.getElementById('upload-area').classList.add('has-img');
  } catch { toast('이미지 처리 오류', 'err'); }
}

function clearImg(e) {
  e.stopPropagation();
  pendImg = null;
  document.getElementById('upload-prev').classList.add('hidden');
  document.getElementById('upload-ph').classList.remove('hidden');
  document.getElementById('upload-clear').classList.add('hidden');
  document.getElementById('upload-area').classList.remove('has-img');
  document.getElementById('img-file').value = '';
}

function resizeImg(file, max) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = e => {
      const img = new Image();
      img.onload = () => {
        const ratio = Math.min(max/img.width, max/img.height, 1);
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * ratio);
        c.height = Math.round(img.height * ratio);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = rej;
      img.src = e.target.result;
    };
    fr.onerror = rej;
    fr.readAsDataURL(file);
  });
}

function confirmAdd() {
  if (!pendCard) return;
  const qty = Math.max(1, parseInt(document.getElementById('add-qty').value)||1);
  const cond = document.getElementById('add-cond').value;
  const note = document.getElementById('add-note').value.trim();
  const existing = collection.find(c => c.id === pendCard.id);
  if (existing) {
    existing.quantity = (existing.quantity||0) + qty;
    if (cond) existing.cond = cond;
    if (note) existing.note = note;
    if (pendImg) existing.customImg = pendImg;
    toast(`${pendCard.name} 수량 업데이트 (${existing.quantity}장)`, 'ok');
  } else {
    collection.unshift({ ...pendCard, quantity: qty, cond, note, customImg: pendImg, addedAt: Date.now() });
    toast(`${pendCard.name}을(를) 추가했습니다`, 'ok');
  }
  save();
  updateBadge();
  closeAdd();
  // Refresh qty badge on search grid
  renderSearchQty();
}

function renderSearchQty() {
  document.querySelectorAll('#search-content .card-item').forEach((el, i) => {
    const card = searchResults[i];
    if (!card) return;
    const owned = collection.find(c => c.id === card.id);
    let badge = el.querySelector('.qty-badge');
    if (owned) {
      if (!badge) { badge = document.createElement('div'); badge.className = 'qty-badge'; el.querySelector('.card-img-wrap').appendChild(badge); }
      badge.textContent = owned.quantity;
    } else if (badge) badge.remove();
  });
}

// ── COLLECTION ─────────────────────────────────────────────
function updateBadge() {
  const total = collection.reduce((s,c) => s+(c.quantity||1), 0);
  document.getElementById('coll-badge').textContent = total;
}

function renderColl() {
  updateStats();
  const cont = document.getElementById('coll-content');
  if (!collection.length) {
    cont.innerHTML = '<div class="empty"><div class="empty-icon">📦</div><h3>컬렉션이 비어있어요</h3><p>카드를 검색해서 추가해보세요!</p></div>';
    return;
  }
  const sv = document.querySelector('.sort-sel').value;
  let cards = [...collection];
  if (sv==='date-d') cards.sort((a,b)=>(b.addedAt||0)-(a.addedAt||0));
  else if (sv==='date-a') cards.sort((a,b)=>(a.addedAt||0)-(b.addedAt||0));
  else if (sv==='name-a') cards.sort((a,b)=>a.name.localeCompare(b.name));
  else if (sv==='name-d') cards.sort((a,b)=>b.name.localeCompare(a.name));
  else if (sv==='price-d') cards.sort((a,b)=>(b.prices?.market||0)-(a.prices?.market||0));
  else if (sv==='qty-d') cards.sort((a,b)=>(b.quantity||1)-(a.quantity||1));

  let html = '<div class="grid">';
  cards.forEach(card => {
    const img = card.customImg || card.image || null;
    const lbl = {ko:'한국',ja:'일본',en:'영문'}[card.lang]||card.lang;
    const pr = card.prices?.market ? `${card.prices.cur==='USD'?'$':'€'}${card.prices.market.toFixed(2)}` : '시세 조회 필요';
    const prColor = card.prices?.market ? 'var(--green)' : 'var(--g400)';
    html += `<div class="card-item" onclick="openDetail('${esc(card.id)}')">
      <div class="card-img-wrap">
        ${img ? `<img class="card-img" src="${img}" alt="${esc(card.name)}" loading="lazy" onerror="this.parentNode.innerHTML=noImg()">` : noImg()}
        <div class="lang-badge">${lbl}</div>
        <div class="qty-badge">${card.quantity||1}</div>
      </div>
      <div class="card-info">
        <div class="card-name">${esc(card.name)}</div>
        <div class="card-set">${esc(card.set||'세트 미상')}</div>
        <div class="card-price" style="color:${prColor}">${pr}</div>
      </div>
    </div>`;
  });
  html += '</div>';
  cont.innerHTML = html;
}

function updateStats() {
  const total = collection.reduce((s,c)=>s+(c.quantity||1),0);
  const unique = collection.length;
  let val = 0; let hasP = false;
  collection.forEach(c => { if(c.prices?.market&&c.prices.cur==='USD'){val+=c.prices.market*(c.quantity||1);hasP=true;} });
  document.getElementById('st-total').textContent = total;
  document.getElementById('st-unique').textContent = unique;
  document.getElementById('st-val').textContent = hasP ? `$${val.toFixed(2)}` : '-';
}

// ── DETAIL MODAL ───────────────────────────────────────────
function openDetail(id) {
  const card = collection.find(c => c.id === id);
  if (!card) return;
  detailId = id;
  const img = card.customImg || card.image || null;
  const lbl = {ko:'한국판',ja:'일본판',en:'영문판'}[card.lang]||card.lang;
  const condLbl = {mint:'완벽',  'near-mint':'거의 완벽','excellent':'우수','good':'좋음','poor':'나쁨'};
  document.getElementById('detail-title').textContent = card.name;

  let priceHtml = '';
  if (card.prices) {
    const sym = card.prices.cur==='USD'?'$':'€';
    priceHtml = `<div class="sec-title">시세 (${card.prices.src||''})</div>
      <div class="price-grid">
        ${card.prices.market?`<div class="p-cell"><div class="p-cell-l">시세가</div><div class="p-cell-v">${sym}${card.prices.market.toFixed(2)}</div></div>`:''}
        ${card.prices.low?`<div class="p-cell"><div class="p-cell-l">최저가</div><div class="p-cell-v">${sym}${card.prices.low.toFixed(2)}</div></div>`:''}
        ${card.prices.high?`<div class="p-cell"><div class="p-cell-l">최고가</div><div class="p-cell-v">${sym}${card.prices.high.toFixed(2)}</div></div>`:''}
        ${card.prices.cmAvg?`<div class="p-cell"><div class="p-cell-l">Cardmarket</div><div class="p-cell-v">€${card.prices.cmAvg.toFixed(2)}</div></div>`:''}
      </div><div class="divider"></div>`;
  } else {
    priceHtml = `<div class="sec-title">시세</div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
        <span class="text-muted">시세 정보 없음</span>
        <button class="btn btn-gray btn-sm" id="price-btn" onclick="lookupPrice()">🔍 시세 조회</button>
      </div><div id="price-result"></div><div class="divider"></div>`;
  }

  document.getElementById('detail-body').innerHTML = `
    ${img ? `<img class="detail-img" src="${img}" alt="${esc(card.name)}">` : ''}
    <div class="chips" style="margin-bottom:14px">
      <span class="chip chip-blue">${lbl}</span>
      <span class="chip chip-gray">${esc(card.set||'세트 미상')}</span>
      ${card.cond?`<span class="chip chip-yellow">${condLbl[card.cond]||card.cond}</span>`:''}
    </div>
    <div class="sec-title">수량</div>
    <div class="qty-ctrl" style="margin-bottom:14px">
      <button class="qty-btn" onclick="adjDetailQty(-1)">−</button>
      <input type="number" class="qty-val" id="detail-qty" value="${card.quantity||1}" min="1" max="99" onchange="setDetailQty(this.value)">
      <button class="qty-btn" onclick="adjDetailQty(1)">+</button>
    </div>
    <div class="divider"></div>
    ${priceHtml}
    ${card.note?`<div class="sec-title">메모</div><div class="note-box">${esc(card.note)}</div>`:''}
  `;

  document.getElementById('detail-foot').innerHTML = `
    <button class="btn btn-gray btn-sm" onclick="changeDetailImg()">📷 이미지 변경</button>
    <button class="btn btn-red" onclick="removeCard()">🗑 삭제</button>
    <button class="btn btn-gray" onclick="closeDetail()">닫기</button>
  `;

  document.getElementById('detail-modal').classList.remove('hidden');
}

function closeDetail() { document.getElementById('detail-modal').classList.add('hidden'); detailId = null; }

function adjDetailQty(d) {
  const card = collection.find(c => c.id === detailId);
  if (!card) return;
  card.quantity = Math.max(1, Math.min(99, (card.quantity||1)+d));
  document.getElementById('detail-qty').value = card.quantity;
  save(); updateBadge(); renderColl();
}

function setDetailQty(v) {
  const card = collection.find(c => c.id === detailId);
  if (!card) return;
  card.quantity = Math.max(1, Math.min(99, parseInt(v)||1));
  save(); updateBadge(); renderColl();
}

function removeCard() {
  const card = collection.find(c => c.id === detailId);
  if (!card) return;
  if (!confirm(`"${card.name}" 을(를) 컬렉션에서 삭제할까요?`)) return;
  collection = collection.filter(c => c.id !== detailId);
  save(); updateBadge(); closeDetail(); renderColl();
  toast(`${card.name}을(를) 삭제했습니다`, 'ok');
}

async function lookupPrice() {
  const card = collection.find(c => c.id === detailId);
  if (!card) return;
  const btn = document.getElementById('price-btn');
  if (btn) { btn.textContent = '조회 중...'; btn.disabled = true; }
  try {
    const prices = await fetchPriceFor(card);
    const result = document.getElementById('price-result');
    if (prices && prices.market) {
      card.prices = prices;
      save();
      const sym = prices.cur==='USD'?'$':'€';
      if (result) result.innerHTML = `
        <div class="price-grid" style="margin-bottom:10px">
          <div class="p-cell"><div class="p-cell-l">시세가</div><div class="p-cell-v">${sym}${prices.market.toFixed(2)}</div></div>
          ${prices.low?`<div class="p-cell"><div class="p-cell-l">최저가</div><div class="p-cell-v">${sym}${prices.low.toFixed(2)}</div></div>`:''}
        </div>
        <div class="text-muted" style="margin-bottom:10px">출처: ${prices.src||'pokemontcg.io'} · 영문판 기준 참고가</div>`;
      if (btn) btn.remove();
      renderColl();
    } else {
      if (result) result.innerHTML = '<div class="text-muted" style="margin-bottom:10px">시세 정보를 찾을 수 없습니다</div>';
      if (btn) { btn.textContent = '🔍 시세 조회'; btn.disabled = false; }
    }
  } catch {
    if (btn) { btn.textContent = '🔍 시세 조회'; btn.disabled = false; }
    toast('시세 조회 실패', 'err');
  }
}

function changeDetailImg() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*';
  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;
    try {
      const b64 = await resizeImg(file, 420);
      const card = collection.find(c => c.id === detailId);
      if (card) { card.customImg = b64; save(); closeDetail(); renderColl(); toast('이미지 업데이트됨', 'ok'); }
    } catch { toast('이미지 처리 오류', 'err'); }
  };
  input.click();
}

// ── IMPORT / EXPORT ────────────────────────────────────────
function exportColl() {
  const blob = new Blob([JSON.stringify({version:2,date:new Date().toISOString(),collection},null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `pokemon-collection-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('컬렉션을 내보냈습니다', 'ok');
}

function importColl(input) {
  const file = input.files[0]; if (!file) return;
  const fr = new FileReader();
  fr.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      const arr = data.collection || data;
      if (!Array.isArray(arr)) { toast('올바른 형식이 아닙니다', 'err'); return; }
      if (!confirm(`${arr.length}개 카드를 가져올까요? 기존 컬렉션에 병합됩니다.`)) return;
      arr.forEach(card => {
        const ex = collection.find(c => c.id === card.id);
        if (ex) ex.quantity = (ex.quantity||1)+(card.quantity||1);
        else collection.push(card);
      });
      save(); updateBadge(); renderColl();
      toast(`${arr.length}개 카드를 가져왔습니다`, 'ok');
    } catch { toast('파일 읽기 오류', 'err'); }
  };
  fr.readAsText(file);
  input.value = '';
}

// ── TOAST ──────────────────────────────────────────────────
function toast(msg, type='') {
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = `toast${type==='ok'?' toast-ok':type==='err'?' toast-err':''}`;
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

// ── UTIL ───────────────────────────────────────────────────
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ── INIT ───────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeAdd(); closeDetail(); }
});
updateBadge();
</script>
